name: Deploy

# Triggers: direct pushes to dev auto-deploy; stage/prod deploy only when a
# PR targeting that branch is merged (not just closed unmerged).
on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - closed
    branches:
      - stage
      - prod

jobs:
  # Map the triggering branch/PR-base to a deploy environment name. Only runs
  # for direct pushes or actually-merged PRs (see detect-environment's `if`).
  detect-environment:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - id: detect
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.pull_request.base.ref }}" == "stage" ]]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.pull_request.base.ref }}" == "prod" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          fi

  # Delegate the actual build/test/deploy pipeline to the shared framework
  # workflow, pinned to the v1 tag of aws-cicd-framework.
  deploy:
    needs: detect-environment
    permissions:
      id-token: write
      contents: read
    uses: loriamichaelj/aws-cicd-framework/.github/workflows/deploy.yml@v1
    with:
      app-name: python-app
      language: python
      environment: ${{ needs.detect-environment.outputs.environment }}
      aws-region: us-east-1
    secrets: inherit
